<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройка справочников практики</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; color: #333; }
        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
        .header-nav h1 { margin: 0; font-size: 1.5rem; }
        .tabs { display: flex; gap: 5px; margin-bottom: 1rem; border-bottom: 2px solid #ddd; flex-wrap: wrap; }
        .tab { padding: 10px 15px; cursor: pointer; background: #ecf0f1; border: 1px solid #ddd; border-bottom: none; border-radius: 5px 5px 0 0; font-weight: bold; }
        .tab.active { background: #fff; border-bottom: 2px solid #fff; margin-bottom: -2px; color: #2980b9; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.95rem; font-weight: bold; margin-right: 8px; margin-bottom: 8px; text-decoration: none; display: inline-block; }
        .btn-primary { background: #3498db; color: white; }
        .btn-success { background: #2ecc71; color: white; }
        .btn-secondary { background: #95a5a6; color: white; }
        
        .table-container { overflow-x: auto; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 800px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: top; }
        th { background: #ecf0f1; }
        tr:hover { background: #f1f8ff; cursor: pointer; }
        tr.selected { background: #d4edda; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .form-group { margin-bottom: 0.5rem; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 0.3rem; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .form-group .hint { font-size: 0.8rem; color: #666; margin-top: 0.2rem; }
        
        .log-box { background: #2c3e50; color: #ecf0f1; padding: 1rem; border-radius: 4px; font-family: monospace; white-space: pre-wrap; font-size: 0.9rem; margin-top: 1rem; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header-nav">
        <h1>⚙️ Настройка справочников</h1>
        <a href="generate-apps.html" class="btn btn-secondary">📄 Перейти к генерации из Excel</a>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('modules')">Модули и генерация</div>
    </div>

    <div id="modules" class="tab-content active">
        <div class="card">
            <h2>1. Выберите практики для генерации</h2>
            <div style="margin-bottom: 1rem;">
                <button class="btn btn-secondary" onclick="selectAll(true)">Выбрать все показанные</button>
                <button class="btn btn-secondary" onclick="selectAll(false)">Снять выделение</button>
            </div>
            <div class="table-container">
                <table id="modulesTable">
                    <thead>
                        <tr>
                            <th style="width: 40px;">✓</th>
                            <th>Группа</th>
                            <th>Сем.</th>
                            <th>Тип</th>
                            <th>Модуль (ПМ)</th>
                            <th>МДК</th>
                            <th>Часы</th>
                            <th>Период (из КУГ)</th>
                        </tr>
                    </thead>
                    <tbody id="modulesBody"></tbody>
                </table>
            </div>
            <p id="selectionCount" style="font-weight: bold; color: #2980b9;">Выбрано: 0</p>
        </div>

        <div class="card hidden" id="orgDataCard">
            <h2>2. Данные организации</h2>
            <div class="form-grid" id="orgForm"></div>
            
            <details style="margin-top: 1.5rem; padding: 1rem; background: #fff; border: 1px solid #ddd; border-radius: 4px;">
                <summary style="font-weight: bold; cursor: pointer;">Руководители от техникума (нажмите, чтобы изменить)</summary>
                <div class="form-grid" id="ooForm" style="margin-top: 1rem;"></div>
            </details>

            <div style="margin-top: 1.5rem;">
                <button id="btnGenerateSetup" class="btn btn-success">📦 Сформировать приложения (ZIP)</button>
            </div>
            <div id="setupLog" class="log-box hidden"></div>
        </div>
    </div>

    <!-- Библиотеки -->
    <script src="../vendor/pizzip.min.js"></script>
    <script src="../vendor/docxtemplater.js"></script>
    <script src="../vendor/jszip.min.js"></script>
    <script src="../vendor/FileSaver.min.js"></script>
    
    <!-- Логика -->
    <script src="../assets/js/services/apps-generator.js"></script>
    <script>
        const G = window.AppsGenerator;
        let refData = { groups: [], calendar: [], modules: [] };
        let selectedModules = new Set();

        async function loadData() {
            try {
                const t = Date.now();
                const get = async (name) => (await fetch(`../data/${name}.json?t=${t}`)).json();
                refData.groups = await get('groups');
                refData.calendar = await get('calendar');
                refData.modules = await get('modules');
                renderModulesTable();
                renderOrgForm();
            } catch (e) {
                alert('Ошибка загрузки справочников. Убедитесь, что запущен python3 -m http.server 8000');
            }
        }

        function renderModulesTable() {
            const tbody = document.getElementById('modulesBody');
            tbody.innerHTML = '';
            refData.modules.forEach((m, idx) => {
                const cal = G.findCalendar(refData.calendar, m.group_code, m.semester, m.practice_type);
                const period = cal ? `${cal.start_date} – ${cal.end_date}` : 'Период не найден';
                
                const tr = document.createElement('tr');
                tr.dataset.idx = idx;
                tr.dataset.key = `${m.group_code}|${m.semester}|${m.practice_type}`;
                tr.innerHTML = `
                    <td><input type="checkbox" class="row-check" ${selectedModules.has(idx) ? 'checked' : ''}></td>
                    <td>${m.group_code}</td>
                    <td>${m.semester}</td>
                    <td>${m.practice_type}</td>
                    <td><b>${m.pm_code}</b><br>${m.pm_name}</td>
                    <td>${m.mdk}</td>
                    <td>${m.hours}</td>
                    <td>${period}</td>
                `;
                tr.addEventListener('click', (e) => {
                    if (e.target.type !== 'checkbox') {
                        const cb = tr.querySelector('.row-check');
                        cb.checked = !cb.checked;
                    }
                    updateSelection();
                });
                tr.querySelector('.row-check').addEventListener('change', updateSelection);
                tbody.appendChild(tr);
            });
            updateSelection();
        }

        function updateSelection() {
            selectedModules.clear();
            let count = 0;
            document.querySelectorAll('#modulesBody tr').forEach(tr => {
                const cb = tr.querySelector('.row-check');
                if (cb.checked) {
                    selectedModules.add(parseInt(tr.dataset.idx));
                    tr.classList.add('selected');
                    count++;
                } else {
                    tr.classList.remove('selected');
                }
            });
            document.getElementById('selectionCount').textContent = `Выбрано: ${count}`;
            document.getElementById('orgDataCard').classList.toggle('hidden', count === 0);
        }

        function selectAll(state) {
            document.querySelectorAll('.row-check').forEach(cb => cb.checked = state);
            updateSelection();
        }

        function renderOrgForm() {
            const orgContainer = document.getElementById('orgForm');
            orgContainer.innerHTML = G.ORG_FIELDS.map(f => `
                <div class="form-group">
                    <label>${f.label} ${f.required ? '*' : ''}</label>
                    <input type="text" id="org_${f.key}" placeholder="${f.placeholder || ''}">
                    <div class="hint">${f.hint}</div>
                </div>
            `).join('');

            const ooContainer = document.getElementById('ooForm');
            ooContainer.innerHTML = G.OO_FIELDS.map(f => `
                <div class="form-group">
                    <label>${f.label}</label>
                    <input type="text" id="oo_${f.key}" value="${G.DEFAULT_OO[f.key] || ''}">
                    <div class="hint">${f.hint}</div>
                </div>
            `).join('');
        }

        function getOrgData() {
            const data = {};
            G.ORG_FIELDS.forEach(f => {
                data[f.key] = document.getElementById(`org_${f.key}`).value;
            });
            const oo = {};
            G.OO_FIELDS.forEach(f => {
                oo[f.key] = document.getElementById(`oo_${f.key}`).value;
            });
            return { org: data, oo: oo };
        }

        document.getElementById('btnGenerateSetup').addEventListener('click', async () => {
            const log = document.getElementById('setupLog');
            log.classList.remove('hidden');
            log.textContent = '⏳ Загрузка шаблонов и генерация...';
            
            try {
                const tpl = await G.loadTemplates('../templates/');
                const { org, oo } = getOrgData();
                const zip = new JSZip();
                let count = 0;

                // Группируем выбранные модули по группе/семестру/типу
                const grouped = {};
                selectedModules.forEach(idx => {
                    const m = refData.modules[idx];
                    const key = `${m.group_code}|${m.semester}|${m.practice_type}`;
                    if (!grouped[key]) {
                        grouped[key] = { group: m.group_code, semester: m.semester, type: m.practice_type, modules: [] };
                    }
                    grouped[key].modules.push(m);
                });

                for (const g of Object.values(grouped)) {
                    const groupData = G.findGroup(refData.groups, g.group);
                    const calData = G.findCalendar(refData.calendar, g.group, g.semester, g.type);
                    
                    const docData = G.buildDocData({
                        group: groupData,
                        calendar: calData,
                        modules: g.modules,
                        org: org,
                        oo: oo,
                        students: [] // Пустой массив, так как таблица в шаблоне пока без цикла
                    });

                    const base = `${g.group}_${g.type}_сем${g.semester}`;
                    zip.file(`Приложение_1_${base}.docx`, G.renderTemplate(tpl.app1, docData));
                    zip.file(`Приложение_2_${base}.docx`, G.renderTemplate(tpl.app2, docData));
                    count++;
                }

                const content = await zip.generateAsync({ type: 'blob' });
                saveAs(content, `Приложения_выборочные_${new Date().toISOString().slice(0,10)}.zip`);
                log.textContent = `✅ Успешно! Сформировано комплектов: ${count}. Архив скачан.`;
            } catch (error) {
                console.error(error);
                log.textContent = `❌ Ошибка: ${G.explainError(error)}`;
            }
        });

        function switchTab(id) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(id).classList.add('active');
        }

        loadData();
    </script>
</body>
</html>
